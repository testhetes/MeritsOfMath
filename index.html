<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Merits of Math</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#14131A">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@800&family=Inter:wght@400;600&family=Space+Grotesk:wght@700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <script>
        // MathJax 3 recognises only \( \) for inline maths by default. Measured on the live
        // site, 2026-09-13: `$\frac{1}{2}$` rendered 0 formulas. The tutor model emitted both
        // $...$ and \(...\) in consecutive replies, so both must be enabled. This config must
        // exist BEFORE tex-mml-chtml.js loads, or MathJax starts with its defaults.
        //
        // Chat text is steerable by the child and replayed from localStorage, and MathJax builds
        // its output AFTER js/chat.js has sanitised the message HTML, so DOMPurify never sees it.
        // Measured on the live site, 2026-09-14, without the settings below:
        // \href{javascript:...}{...} became a clickable link that ran script, and
        // \style{position:fixed;...}{...} covered the whole page. \bbox[...] passes CSS through
        // as well. ui/safe (not bundled in tex-mml-chtml.js) strips every URL, class, id and
        // style from typeset maths. It does NOT filter fontfamily, fontweight or fontstyle, which
        // MathJax copies raw into a style string: \mmlToken{mi}[fontfamily="x;position:fixed;..."]
        // and \unicode[x;position:fixed;...] still covered the page (measured 2026-09-14). So
        // js/chat.js strips those three attributes from every formula too, and refuses to
        // typeset at all unless MathJax's document really has the safe filter installed: if
        // safe.js fails to load, MathJax's startup never finishes, and if it loads but never
        // runs, the document has no `safe`. Either way maths stays as plain text.
        window.MathJax = {
            loader: {
                load: ['ui/safe']
            },
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                // Second layer: never load the html extension (\href, \style, \class, \cssId),
                // whether automatically or by \require{html}.
                autoload: { html: [] },
                require: { allow: { html: false } }
            },
            options: {
                safeOptions: {
                    allow: { URLs: 'none', classes: 'none', cssIDs: 'none', styles: 'none' }
                }
            },
            startup: {
                // js/chat.js is the only thing that ever typesets (see its comments for why).
                // If MathJax also auto-typesets the page on load, that is a second pass over
                // content js/chat.js is about to typeset itself, and MathJax does not skip
                // content it has already processed -- it nests a fresh copy inside it. Measured
                // on the live site, 2026-09-13, calling typesetPromise([#messages]) on an
                // already-rendered 3-formula reply produced 6 mjx-container nodes, and a second
                // such call produced 9. Disabling MathJax's own pass removes that race, including
                // on a cached reload served by the service worker.
                typeset: false
            }
        };
    </script>
    <!-- Both pinned to exact versions (byte-identical to what the floating URLs served on
         2026-09-14): the safe-mode config above depends on MathJax 3.x, ui/safe loads from the
         same versioned path, and js/chat.js overrides marked's html renderer, whose signature
         has changed between marked major versions. -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.13/lib/marked.umd.js"></script>
    <!-- marked does not sanitise its output; DOMPurify cleans it before chat.js ever touches
         innerHTML (see js/chat.js). Pinned to an exact version so a CDN update can't change
         sanitising behaviour under us. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.15/purify.min.js"></script>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <header class="chat-header">
        <button type="button" class="btn tone-neutral icon-btn" id="back-btn" title="Về trang chủ" aria-label="Về trang chủ" hidden>&#8592;</button>
        <div class="logo" aria-hidden="true">M</div>
        <div>
            <h1>Merits of Math</h1>
            <p class="sub">Gia sư toán của em</p>
        </div>
        <div class="spacer"></div>
        <button type="button" class="btn tone-neutral icon-btn" id="clear-btn" title="Cuộc trò chuyện mới" aria-label="Cuộc trò chuyện mới" hidden>&#8635;</button>
    </header>

    <section class="home" id="home" hidden></section>

    <div class="messages" id="messages" hidden></div>

    <form class="composer" id="composer">
        <button type="button" class="btn tone-lavender mathpad-toggle" id="mathpad-toggle" aria-pressed="false" aria-label="Bàn phím toán" hidden>123<br>×÷</button>
        <textarea id="input" rows="1" placeholder="Hỏi cô về toán..." aria-label="Hỏi cô về toán"></textarea>
        <button type="submit" class="btn tone-yellow send-btn" id="send-btn" disabled>Gửi</button>
    </form>
    <div class="mathpad" id="mathpad" hidden></div>

    <script src="js/mathpad.js"></script>
    <script src="js/lessons.js"></script>
    <script src="js/chat.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
</body>
</html>
