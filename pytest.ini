[pytest]
# Second layer of secret protection. The first layer is the report-redaction
# hook in tests/conftest.py. The short traceback style never prints a failing
# function's arguments, so a fixture holding INGEST_SECRET is not echoed even
# if that hook were ever removed. `--tb=long` still works when you need it;
# the hook redacts that output too.
addopts = --tb=short
